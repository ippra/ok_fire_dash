# Refresh from NOAA and publish to GitHub Pages.
#
# Runs the whole pipeline every three hours. The raw archives are not in the
# repo; they live in the Actions cache between runs, so a routine run downloads
# only the last few days. Each has its own cache entry, so adding one never
# invalidates another. If a cache is evicted, the refresh rebuilds that archive
# from scratch: about 40 minutes for NOAA detections (data/hms_text, 50 MB),
# about 5 for Oklahoma IPAWS messages (data/ipaws, 30 MB, read out of 1.8 GB).
#
# A failed run publishes nothing, so the site keeps the last good build, and
# GitHub emails the repository owner. The usual causes are NOAA being down
# (the next run retries) or a new satellite or method name, which needs a row
# in reference/.

name: Refresh and publish

on:
  schedule:
    - cron: "23 */3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# One run at a time, and never cancel one mid-refresh: the archive it saves is
# what the next run builds on.
concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::tidyverse
            any::sf
            any::jsonlite
            any::curl
            any::here
            any::rmapshaper
            any::xml2

      - name: Restore NOAA archive
        uses: actions/cache/restore@v4
        with:
          path: data/hms_text
          key: hms-archive-${{ github.run_id }}
          restore-keys: hms-archive-

      - name: Restore IPAWS archive
        uses: actions/cache/restore@v4
        with:
          path: data/ipaws
          key: ipaws-archive-${{ github.run_id }}
          restore-keys: ipaws-archive-

      - name: Refresh, build data, assemble site
        run: Rscript 00_run_pipeline.R

      # Saved even when a later step fails, so a cold start interrupted by a
      # NOAA outage resumes where it stopped instead of starting over.
      - name: Save NOAA archive
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/hms_text
          key: hms-archive-${{ github.run_id }}

      - name: Save IPAWS archive
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/ipaws
          key: ipaws-archive-${{ github.run_id }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: outputs/07_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
